; DefaultInput.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Enhanced Input habilitado a nivel de motor.
;  Los IMC/InputActions se crean como uasset en el editor.
; ═══════════════════════════════════════════════════════════════════════════

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bUseMouseForTouch=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True

[/Script/EnhancedInput.EnhancedInputProjectSettings]
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultEnhancedInputMappingContextClass=/Script/EnhancedInput.InputMappingContext

; --- Fallback: Axis/Action mappings clásicos (provisional) ---
; Si Enhanced Input no tiene assets asignados, estas acciones funcionan.
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.0,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.0,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=-1.0,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=1.0,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=MouseX)
+AxisMappings=(AxisName="Turn",Scale=1.0,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUp",Scale=-1.0,Key=MouseY)
+AxisMappings=(AxisName="LookUp",Scale=1.0,Key=Gamepad_RightY)
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Crouch",Key=C)
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Disguise",Key=H)
+ActionMappings=(ActionName="Menu",Key=Escape)
+ActionMappings=(ActionName="ConvocarManifa",Key=M)
