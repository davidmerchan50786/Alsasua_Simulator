; DefaultEngine.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Configuración del motor — AlsasuaSimulator (UE 5.4 / 5.7)
;  Render AAA+++, NavMesh por invokers, DX12, Lumen, Nanite.
; ═══════════════════════════════════════════════════════════════════════════

; --- Mapa por defecto ---
; Cuando crees L_Alsasua (Empty Level) en Content/Maps/, descomenta las líneas
; de abajo. De momento apunta al nivel de ejemplo WhiteCastle si existe.
[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/AlsasuaGameplay.AlsasuaGameplayGameMode
; EditorStartupMap=/Game/Maps/L_Alsasua.L_Alsasua
; GameDefaultMap=/Game/Maps/L_Alsasua.L_Alsasua

; HUD del menú principal (Gameplay no puede referenciar la UI → por config).
[/Script/AlsasuaGameplay.AlsasuaGameplayGameMode]
HUDClass=/Script/AlsasuaUI.AlsasuaHUD

; --- Render: pila AAA+++ ---
; Lumen HW Ray Tracing + reflejos Lumen + Virtual Shadow Maps + TSR + Nanite.
; Lumen cae a software en GPU sin RT.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2
r.RayTracing=True
r.RayTracing.Shadows=True
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.Method=0
r.AllowStaticLighting=False
r.Nanite.ProjectEnabled=True

; --- Graphics API: DX12 ---
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; --- Navegación: navmesh por invokers ---
; Genera la navmesh SOLO alrededor del jugador (invoker).
; El RecastNavMesh se autocrea; UNavMeshAlsasua registra el invoker.
[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bGenerateNavigationOnlyAroundNavigationInvokers=True

; --- Landscape por defecto (para referencia del editor) ---
; ScaleX=178.5714, ScaleY=178.5714, ScaleZ=200, LocationZ=49567
; SectionSize=63, SectionsPerComponent=1
; Archivo: Content/Terreno/alsasua_landscape_4033.r16

[/Script/LiveCoding.LiveCodingSettings]
bEnabled=False
AllowLiveCoding=False

; ═══════════════════════════════════════════════════════════════════════════
; [SystemSettings] — CVars de calidad máxima (fidelidad gráfica 100%)
; ═══════════════════════════════════════════════════════════════════════════
[SystemSettings]
; --- TSR: anti-aliasing de precisión máxima ---
r.TSR.History.ScreenPercentage=200
r.TSR.RejectionAntiAliasingQuality=2
r.TemporalAASamples=8

; --- Lumen: distancia de traza y resolución máximas ---
r.Lumen.MaxTraceDistance=100000
r.Lumen.Scene.SurfaceCacheResolution=1.0
r.Lumen.Reflections.AllowScreenSpaceReprojection=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.DownsampleFactor=1

; --- Virtual Shadow Maps: páginas físicas para 2 km de mundo ---
r.Shadow.Virtual.MaxPhysicalPages=4096
r.Shadow.CSM.MaxCascades=6
r.Shadow.MaxResolution=4096

; --- Distance Fields: sombras y AO precisos ---
r.DistanceFieldShadowing=1
r.DistanceFieldAO=1
r.AOGlobalDistanceField.MinMeshSDFRadius=1

; --- Post-process cinematográfico ---
r.Tonemapper.Quality=5
r.BloomQuality=5
r.MotionBlurQuality=4
r.DepthOfFieldQuality=4
r.AmbientOcclusionLevels=3
r.AmbientOcclusionMaxQuality=100
r.HZBOcclusion=1

; --- Texturas: máxima resolución y anisotropía ---
r.MaxAnisotropy=16
r.Streaming.MaxEffectiveTextureSize=4096

; --- Nubes volumétricas con sombras (cielo vasco) ---
r.VolumetricCloud=1
r.VolumetricCloud.ShadowMap.Enable=1
r.VolumetricCloud.ShadowMap.RaymarchingStepCount=10

; --- Nanite: precisión de borde sub-píxel ---
r.Nanite.MaxPixelsPerEdge=0.5
r.Nanite.ProxyTriangleThreshold=50000

