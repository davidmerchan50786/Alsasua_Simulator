; ── Render: iluminación dinámica realista (Lumen + Nanite + VSM) ──────────
; Requiere DX12/SM6: Nanite y Virtual Shadow Maps no existen en SM5, y en DX11
; Lumen cae a un fallback muy degradado. El perfil Low de
; UAlsasuaGraphicsSettingsSubsystem cubre las GPUs justas.

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
r.GenerateMeshDistanceFields=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.Method=0
r.AllowStaticLighting=False
r.Nanite.ProjectEnabled=True
r.MeshDrawCommands.DynamicInstancing=1

; GI: 4 slices es la calidad por defecto de Lumen; con 1 la radiosidad sale
; manchada y el rebote indirecto de fachadas/calles se pierde.
r.LumenScene.Radiosity.HemisphereSliceCount=4
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.LumenScene.Radiosity.ProbeSpacing=4

; Sombras: VSM para el sol, contact shadows para asentar objetos pequeños
; (mobiliario, bordillos) que las cascadas no resuelven.
r.Shadow.Virtual.Enable=1
r.Shadow.DistanceScale=1.0
r.Shadow.MaxResolution=2048
r.Shadow.CSM.MaxCascades=6
r.Shadow.RadiusThreshold=0.02
r.ContactShadows=1
r.CapsuleShadows=1
r.DistanceFieldShadowing=1
r.DistanceFieldAO=1
r.View.DistanceScale=1.0

; Atmósfera física: el cielo se deriva del sol (Rayleigh/Mie), no de un color fijo.
r.Fog=1
r.Atmosphere=1
r.SkyAtmosphere=1
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=128
r.VolumetricCloud=1
r.SkyLight.RealTimeReflectionCapture=1
r.SSR.Quality=3

; Sin static lighting el AO no debe reservar fracción para lightmaps.
r.DefaultFeature.AmbientOcclusionStaticFraction=False

; ── Texture Streaming ──────────────────────────────────────────────────────
[/Script/Engine.RendererSettings]
r.Streaming.PoolSize=2048
r.Streaming.MaxTempMemoryAllowed=128
r.Streaming.BoostPlayerTextures=1.0
r.SkeletalMeshLODBias=1
r.StaticMeshLODBias=0

; ── Nanite ─────────────────────────────────────────────────────────────────
[/Script/Engine.RendererSettings]
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.AllowTessellation=0

