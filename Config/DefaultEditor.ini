; DefaultEditor.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Configuración del editor — AlsasuaSimulator
; ═══════════════════════════════════════════════════════════════════════════

; ── Editor Engine ──────────────────────────────────────────────────────────
[/Script/UnrealEd.EditorEngine]
bAutoCompileBlueprints=False
bSmoothFrameRate=True
bAllowEditorWindowFocus=False

; ── Live Coding (desactivado) ──────────────────────────────────────────────
[/Script/LiveCoding.LiveCodingSettings]
bEnabled=False
AllowLiveCoding=False
StartupDelaySeconds=0.0

; ── Editor Performance ─────────────────────────────────────────────────────
[/Script/UnrealEd.EditorPerformanceSettings]
bShowLiveCodingConsole=False
bEnablePerformanceWarnings=True

; ── Per-project editor user settings ───────────────────────────────────────
[/Script/UnrealEd.EditorPerProjectUserSettings]
bAutoSaveEnabled=False
bEnableSCCAutoAddNewFiles=False

; ── Content Browser ────────────────────────────────────────────────────────
[/Script/ContentBrowser.ContentBrowserConfig]
bDisplayObjectPath=True
bDisplayPackagePath=False
bAllowSourceControlIntegration=False
bShowFolders=True
bFilterRecursively=False
bShowPluginFolders=False
bSortByDateModifiedDesc=False
bAllowDragDrop=True
bShowHiddenFolders=False

; ── Static Mesh Editor defaults ────────────────────────────────────────────
[/Script/UnrealEd.StaticMeshEditorSettings]
bShowWireframe=False
bShowGrid=True
bShowBounds=False
bShowCollision=False
bShowNormals=False
bShowTangents=False
bShowBinormals=False
GridSize=(X=100.000000,Y=100.000000,Z=100.000000)

; ── World Settings defaults ────────────────────────────────────────────────
[/Script/UnrealEd.EditorWorldSettings]
bEnableWorldPartition=False
bWorldPartitionEnableHashing=False

; ── Blueprint Editor ───────────────────────────────────────────────────────
[/Script/UnrealEd.BlueprintEditorSettings]
bShowBlueprintCompilerErrors=True
bHighlightOpenNodes=True
bShowEmptyK2NodePalette=False

; ── Python / Scripting ────────────────────────────────────────────────────
[/Script/UnrealEd.PythonScriptPluginSettings]
bDeveloperMode=True
bEnableEditorIntegration=True

; ── Import defaults ────────────────────────────────────────────────────────
[/Script/UnrealEd.ImportSettings]
DefaultImportCollisionType=ECT_ImportAsCollisionDisabled
bAutoComputeLodDistances=False

; ── Level Editor defaults ──────────────────────────────────────────────────
[/Script/UnrealEd.LevelEditorMiscSettings]
bAllowBackgroundActorUpdate=True
bEnableActorBatchRename=False

; ── PIE (Play in Editor) ──────────────────────────────────────────────────
[/Script/UnrealEd.PlayInEditorSettings]
bUseNewLevelStreaming=True
bVerifyPeerConnection=False
bReuseWorldForPIE=True
bCoopMode=False
NumPIEInstances=1
PIESeparateViewports=False
