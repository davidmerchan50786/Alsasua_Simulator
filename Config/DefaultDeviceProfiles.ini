; Techo de resolución por grupo de textura.
;
; Por qué existe este fichero: la sesión de perfilado del 2026-08-23 murió en el
; frame 903 de los 240 s sin volcado de crash, y el log deja el motivo a la vista:
;
;   BEWARE: AssetCompile memory estimate is greater than available, but we're
;   running it [TextureDerivedData] anyway!
;   RequiredMemory = 5547.67 MiB, MemoryLimit = 5190.96 MiB
;
; Eran 5,5 GB para comprimir UNA textura: T_GV_Shrub_Typ1_N, 8192² BC6H. El
; sufijo _N dice lo que es —el normal map de la hoja de un arbusto— y 8192² para
; eso no lo justifica nada. El motor se salta su propio límite y sigue, así que
; no falla de forma limpia: se come la RAM y el proceso muere sin decir por qué.
;
; No es un caso aislado. En Content/ hay una docena de 8K por encima de 100 MB,
; casi todas de UnrealDrive_CitySample, un pack de terceros que no usa nada del
; pueblo (ver Docs/baseline_5_8.md).
;
; Se topa por GRUPO en vez de tocar cada uasset porque los packs están fuera de
; git (.gitignore) y cualquier reimportación revertiría el cambio por asset.
; Esto se versiona y sobrevive.

[GlobalDefaults DeviceProfile]

; Normal, specular y rugosidad: 2048 sobra. Un normal map guarda direcciones de
; superficie, no detalle fino; a 8192² se gastan 4 veces la memoria en algo que
; no se distingue a distancia de juego.
+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_CharacterSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WeaponNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_WeaponSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

; Color de mundo y personaje: 4096. Es el doble de lo que se ve en pantalla a
; 1280×720 y deja margen para acercarse a una fachada.
;
; OJO: TEXTUREGROUP_World es donde cae la ortofoto PNOA del terreno
; (T_Satelite_Alsasua, 8192², 104 MB), que SÍ necesita su resolución: cubre
; 7,2 km de pueblo y a 4096 se ve el pixelado desde el suelo. Por eso este grupo
; se queda en 8192 y no en 4096 — el ahorro grande ya lo dan los normal maps.
+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=8192,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Character,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
+TextureLODGroups=(Group=TEXTUREGROUP_Weapon,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)

; Vegetación: el caso que reventó la sesión. Una hoja de arbusto no necesita más.
+TextureLODGroups=(Group=TEXTUREGROUP_Terrain_Weightmap,MinLODSize=1,MaxLODSize=4096,LODBias=0,MinMagFilter=aniso,MipFilter=point,MipGenSettings=TMGS_SimpleAverage)
