; DefaultGame.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Configuración de juego — AlsasuaSimulator
; ═══════════════════════════════════════════════════════════════════════════

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=AlsasuaSimulator
ProjectVersion=0.1.0
Description=Alsasua Simulator — mundo abierto fiel de Alsasua/Navarra (AAA+++).
CompanyName=
CopyrightNotice=Altsasu/Alsasua — Proyecto de reproducción fiel
HomepageProjectName=
LicensingTerms=
SupportContact=
bShouldWindowPreserveAspectRatio=True
bUseBorderlessWindow=False
bUseFixedFrameRate=False
FixedFrameRate=60.0
bAllowWindowResize=True
bUseVSync=False

; ── Internationalization ───────────────────────────────────────────────────
[/Script/InternationalizationSettings.InternationalizationSettings]
CulturesToStage=en,eu-ES,es-ES
DefaultCulture=en

; ── GameMode (referencia única — DefaultEngine.ini tiene la config activa) ─
[/Script/AlsasuaGameplay.AlsasuaGameplayGameMode]
DefaultPawnClass=/Script/AlsasuaManifa.AlsasuaCharacter
PlayerControllerClass=/Script/AlsasuaManifa.AlsasuaPlayerController
HUDClass=/Script/AlsasuaUI.AlsasuaHUD
GameStateClass=/Script/Engine.GameStateBase
PlayerStateClass=/Script/Engine.PlayerState

; ── Packaging ──────────────────────────────────────────────────────────────
[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
bCompressed=True
bUseIoStore=True
bUseZenStore=True
bShareMaterialCompilerNodes=True
bDeterministicShaderMapOrdering=True

[/Script/UnrealEd.ProjectPackagingSettings]
; Directorios a incluir (solo lo necesario para reducir pak)
+DirectoriesToAlwaysCook=(Path="/Game/Datos")
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysStageAsUFS=(Path="/Game/Datos")
+DirectoriesToAlwaysStageAsNonUFS=(Path="/Game/Maps")

; ── Asset Manager (orden de carga de datos) ────────────────────────────────
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="Map",AssetBaseClass="/Script/Engine.World",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Maps")))
+PrimaryAssetTypesToScan=(PrimaryAssetType="BuildingData",AssetBaseClass="/Script/Engine.DataAsset",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Datos")))
+DirectoriesToNeverCook=(Path="/Game/Test")
+DirectoriesToNeverCook=(Path="/Game/Temp")
