; DefaultGame.ini
; ═══════════════════════════════════════════════════════════════════════════
;  Configuración de juego — AlsasuaSimulator
; ═══════════════════════════════════════════════════════════════════════════

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=AlsasuaSimulator
ProjectVersion=0.1.0
Description=Alsasua Simulator — mundo abierto fiel de Alsasua/Navarra (AAA+++).
CompanyName=
CopyrightNotice=Altsasu/Alsasua — Proyecto de reproducción fiel
HomepageProjectName=
LicensingTerms=
SupportContact=
bShouldWindowPreserveAspectRatio=True
bUseBorderlessWindow=False
bUseFixedFrameRate=False
FixedFrameRate=60.0
bAllowWindowResize=True
bUseVSync=False

; ── Internationalization ───────────────────────────────────────────────────
[/Script/InternationalizationSettings.InternationalizationSettings]
CulturesToStage=en,eu-ES,es-ES
DefaultCulture=en

; ── GameMode (referencia única — DefaultEngine.ini tiene la config activa) ─
[/Script/AlsasuaGameplay.AlsasuaGameplayGameMode]
DefaultPawnClass=/Script/AlsasuaKernel.AlsasuaCharacter
PlayerControllerClass=/Script/AlsasuaKernel.AlsasuaPlayerController
HUDClass=/Script/AlsasuaUI.AlsasuaHUD
GameStateClass=/Script/Engine.GameStateBase
PlayerStateClass=/Script/Engine.PlayerState

; ── Packaging ──────────────────────────────────────────────────────────────
[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
bCompressed=True
bUseIoStore=True
bUseZenStore=True
bShareMaterialCompilerNodes=True
bDeterministicShaderMapOrdering=True

[/Script/UnrealEd.ProjectPackagingSettings]
; Directorios a incluir (solo lo necesario para reducir pak)
+DirectoriesToAlwaysCook=(Path="/Game/Datos")
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysStageAsUFS=(Path="/Game/Datos")
+DirectoriesToAlwaysStageAsNonUFS=(Path="/Game/Maps")

; ── Asset Manager (orden de carga de datos) ────────────────────────────────
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="Map",AssetBaseClass="/Script/Engine.World",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Maps")))
+PrimaryAssetTypesToScan=(PrimaryAssetType="BuildingData",AssetBaseClass="/Script/Engine.DataAsset",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Datos")))
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",ObjectBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,DirectOnly=True,SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+DirectoriesToNeverCook=(Path="/Game/Test")
+DirectoriesToNeverCook=(Path="/Game/Temp")

; ── Perfil gráfico de arranque ─────────────────────────────────────────────
; 0=Low, 1=Medium, 2=High, 3=Ultra. Lo aplica
; UAlsasuaGraphicsSettingsSubsystem al arrancar una partida (EWorldType::Game);
; en el editor y en PIE no se toca nada. Estaba clavado a Ultra en el código y
; se aplicaba en todos los mundos, así que pisaba lo que dice este mismo
; Config/ y hacía que dos arranques con el mismo ini midieran distinto.
;
; Para perfilar contra los números de RESUMEN_TECNICO.md, fija aquí el perfil
; en vez de recompilar.
; El subsistema vive en GF_World desde la re-arquitectura a plugins.
[/Script/GF_World.AlsasuaGraphicsSettingsSubsystem]
PerfilArranque=3

; �� Carga runtime de plugins GF_* �������������������������������������������
; UAlsasuaCargadorPlugins (Kernel) activa estos bundles GameFeatures en el
; arranque de la partida y los descarga al cerrar. Quitar una línea deja el
; plugin compilado pero dormido.
[/Script/AlsasuaKernel.AlsasuaCargadorPlugins]
+PluginsActivables=GF_Abilities
+PluginsActivables=GF_AI
+PluginsActivables=GF_Audio
+PluginsActivables=GF_Carreteras
+PluginsActivables=GF_Clima
+PluginsActivables=GF_Core
+PluginsActivables=GF_Debug
+PluginsActivables=GF_Dialogos
+PluginsActivables=GF_Edificios
+PluginsActivables=GF_Ferrocarril
+PluginsActivables=GF_NPCs
+PluginsActivables=GF_Optimization
+PluginsActivables=GF_Politica
+PluginsActivables=GF_Social
+PluginsActivables=GF_Systems
+PluginsActivables=GF_Trafico
+PluginsActivables=GF_UI
+PluginsActivables=GF_Vegetacion
+PluginsActivables=GF_Vehiculos
+PluginsActivables=GF_World
