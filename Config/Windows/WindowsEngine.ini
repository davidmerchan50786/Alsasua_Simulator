; WindowsEngine.ini — Presupuesto de VRAM para tarjetas de 8 GB (referencia: RX 6650 XT).
;
; Se carga DESPUÉS de DefaultEngine.ini, así que lo que hay aquí manda sin tocar
; aquel fichero. Nace del error "Video memory has been exhausted": DefaultEngine
; había subido buffers fijos de Nanite muy por encima de los de Epic (candidatos
; 64M, visibles 32M —por encima del tope del motor, 16M—, pool de streaming
; 1741 MB), y se reservan enteros aunque la escena no los llene.
;
; Segunda pasada: con los buffers a 8M, L_Sakana —que en tu medición pide 18,5M
; clusters visibles— desbordaba y Nanite dejaba de dibujar trozos (huecos).
; Equilibrio: buffers al tope que admite el motor (16M), y el resto del
; recorte por detalle: MaxPixelsPerEdge 2 dibuja ~4x menos clusters que 1.
; Si aún hay huecos con el aviso "Nanite ... overflow", subir MaxPixelsPerEdge
; a 3; NO los buffers, que ya están en el máximo.

[ConsoleVariables]
; Texturas: reserva fija y nunca más de lo que hay en la tarjeta.
r.Streaming.PoolSize=2500
r.Streaming.LimitPoolSizeToVRAM=1
; Nanite: buffers al tope del motor; el detalle se regula por arista.
r.Nanite.MaxCandidateClusters=16777216
r.Nanite.MaxVisibleClusters=16777216
r.Nanite.MaxNodes=8388608
r.Nanite.MaxPixelsPerEdge=2.0
r.Nanite.Streaming.StreamingPoolSize=1024
; Sombras virtuales: pool fijo.
r.Shadow.Virtual.MaxPhysicalPages=2048
; Lumen: caché de superficie a tamaño de juego, no de cinemática.
r.LumenScene.SurfaceCache.CardMaxResolution=1024
