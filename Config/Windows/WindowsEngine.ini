; WindowsEngine.ini — Presupuesto de VRAM para tarjetas de 8 GB (referencia: RX 6650 XT).
;
; Se carga DESPUÉS de DefaultEngine.ini, así que lo que hay aquí manda sin tocar
; aquel fichero. Nace del error "Video memory has been exhausted": DefaultEngine
; había ido subiendo buffers fijos de Nanite por encima de los de Epic para
; tapar avisos de overflow, y esos buffers se reservan enteros aunque la escena
; no los llene:
;   MaxCandidateClusters 64M  (Epic: 8M)   -> ~1 GB sólo de candidatos
;   MaxVisibleClusters   32M  (tope del motor 16M; por encima, crash)
;   Nanite StreamingPool 1741 MB (Epic: 512)
; Sumado al pool de texturas, Lumen y VSM, una tarjeta de 8 GB no da.
;
; La geometría que no quepa en los buffers se recorta con MaxPixelsPerEdge (más
; píxeles por arista = menos clusters), no agrandando buffers. Si vuelve el aviso
; "Nanite ... buffer overflow" (se ven huecos), subir MaxPixelsPerEdge a 2.0 antes
; que tocar los buffers. Valores de diseño: medir con stat streaming,
; stat RHI y memreport -full.

[ConsoleVariables]
; Texturas: reserva fija y nunca más de lo que hay en la tarjeta.
r.Streaming.PoolSize=2500
r.Streaming.LimitPoolSizeToVRAM=1
; Nanite: buffers a los valores de Epic; el detalle se regula por arista.
r.Nanite.MaxCandidateClusters=8388608
r.Nanite.MaxVisibleClusters=8388608
r.Nanite.MaxNodes=2097152
r.Nanite.MaxPixelsPerEdge=1.5
r.Nanite.Streaming.StreamingPoolSize=768
; Sombras virtuales y niebla volumétrica: pools fijos.
r.Shadow.Virtual.MaxPhysicalPages=2048
r.VolumetricFog.GridPixelSize=8
r.VolumetricFog.GridSizeZ=64
; Lumen: caché de superficie a tamaño de juego, no de cinemática.
r.LumenScene.SurfaceCache.CardMaxResolution=1024
r.Lumen.ScreenProbeGather.ScreenProbeGatherFullResolution=0
